<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Royal Slate to Midnight Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Golden Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Vibrant Intelligence Cyan/Blue Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Subtle Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Emblem Pop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Logo Emblem Group -->
  <g filter="url(#glow)">
    <!-- Wisdom Book Base / Knowledge Wings -->
    <path d="M14 43.5C20 40.5 27 41.5 32 44.5C37 41.5 44 40.5 50 43.5C50 45 37 45.5 32 48.5C27 45.5 14 45 14 43.5Z" 
          fill="url(#cyanGrad)" opacity="0.9"/>
    
    <path d="M15 41C21 38 27.5 39 32 42C36.5 39 43 38 49 41" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Pillar of Truth / Central Quill Spine -->
    <path d="M32 14L37 25H27L32 14Z" fill="url(#goldGrad)"/>
    <path d="M30 25H34V41H30V25Z" fill="url(#goldGrad)"/>

    <!-- Central Ashok Chakra / Intelligence Wheel (Stylized Hub & Rays) -->
    <circle cx="32" cy="29" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <circle cx="32" cy="29" r="2.2" fill="url(#goldGrad)"/>
    
    <!-- Chakra Spokes (Geometric Cardinal & Diagonal Lines) -->
    <line x1="32" y1="21" x2="32" y2="37" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="24" y1="29" x2="40" y2="29" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="26.34" y1="23.34" x2="37.66" y2="34.66" stroke="url(#goldGrad)" stroke-width="1"/>
    <line x1="26.34" y1="34.66" x2="37.66" y2="23.34" stroke="url(#goldGrad)" stroke-width="1"/>

    <!-- Intelligence Sparkle / Guiding Star at Pinnacle -->
    <polygon points="32,9 33.5,12.5 37,13.5 33.5,14.5 32,18 30.5,14.5 27,13.5 30.5,12.5" fill="#fef08a"/>
  </g>
</svg>
